version: '3.8'

services:
  # SERVIÇO DO BANCO DE DADOS POSTGRESQL
  db:
    image: docker.io/library/postgres:15
    container_name: arcade_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arcade_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha_segura_ifsp}
      POSTGRES_DB: ${POSTGRES_DB:-arcade_fight}
    volumes:
      - pgdata:/var/lib/postgresql/data

  # SERVIÇO DA API (FASTAPI)
  api:
    build: 
      context: ./backend
    container_name: arcade_api
    restart: always
    ports:
      - "8000:80"
    environment:
      - DATABASE_URL= ${DATABASE_URL:-postgresql://arcade_admin:senha_segura_ifsp@db:5432/arcade_fight}
      # Lembre-se de trocar o X.X pelo IP real da máquina no fliperama
      - APP_URL=${APP_URL:-http://192.168.X.X} 
    depends_on:
      - db

volumes:
  pgdata:
